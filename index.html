<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tetris - Touch & TV Ready</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0b1220, #071226);
    font-family: "Poppins", sans-serif;
    color: #e6eef8;
  }
  canvas {
    background: #0f1724;
    border-radius: 8px;
    image-rendering: pixelated;
    box-shadow: 0 6px 30px rgba(2,8,23,0.6);
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .hud {
    margin-top: 12px;
    display: flex;
    gap: 24px;
    justify-content: center;
  }
  .label {
    font-size: 12px;
    opacity: 0.7;
  }
  .value {
    font-size: 20px;
    font-weight: bold;
  }
  .tip {
    font-size: 13px;
    margin-top: 12px;
    opacity: 0.8;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <canvas id="board" width="240" height="480"></canvas>
    <div class="hud">
      <div><div class="label">Score</div><div id="score" class="value">0</div></div>
      <div><div class="label">Level</div><div id="level" class="value">1</div></div>
      <div><div class="label">Lines</div><div id="lines" class="value">0</div></div>
    </div>
    <div class="tip">
      操作说明：<br>
      ← / → 移动，↓ 加速下降，空格 落底，<br>
      🔹 <b>点一下画面 或 OK 键旋转方块</b><br>
      P 暂停，R 重开
    </div>
  </div>

<script>
(() => {
  const COLS = 10, ROWS = 20, BLOCK = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');

  const SHAPES = {
    I: [[1,1,1,1]],
    J: [[2,0,0],[2,2,2]],
    L: [[0,0,3],[3,3,3]],
    O: [[4,4],[4,4]],
    S: [[0,5,5],[5,5,0]],
    T: [[0,6,0],[6,6,6]],
    Z: [[7,7,0],[0,7,7]]
  };
  const COLORS = {
    0: 'transparent',
    1: '#1fb6ff', 2: '#005f73', 3: '#ffb86b',
    4: '#ffd166', 5: '#06d6a0', 6: '#9b5de5', 7: '#ef476f'
  };

  let grid, current, next, score, level, lines, dropInterval, dropCounter, lastTime, paused, gameOver;

  const createGrid = ()=>Array.from({length:ROWS},()=>Array(COLS).fill(0));
  const randomPiece = ()=>{
    const keys = Object.keys(SHAPES);
    const k = keys[Math.floor(Math.random()*keys.length)];
    const m = SHAPES[k].map(r=>r.slice());
    return {matrix:m, x:Math.floor((COLS-m[0].length)/2), y:0};
  };

  const rotate = m => m[0].map((_,i)=>m.map(r=>r[i]).reverse());
  const collide = (g,p)=>{
    for(let y=0;y<p.matrix.length;y++)
      for(let x=0;x<p.matrix[y].length;x++)
        if(p.matrix[y][x]&&
          (p.y+y>=ROWS||p.x+x<0||p.x+x>=COLS||g[p.y+y]?.[p.x+x])) return true;
    return false;
  };
  const merge = (g,p)=>{
    p.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v&&p.y+y>=0)g[p.y+y][p.x+x]=v;}));
  };

  const sweep=()=>{
    let count=0;
    outer:for(let y=ROWS-1;y>=0;y--){
      for(let x=0;x<COLS;x++) if(!grid[y][x]) continue outer;
      grid.splice(y,1);
      grid.unshift(Array(COLS).fill(0));
      count++;
    }
    if(count){
      const pts=[0,40,100,300,1200];
      score+=pts[count]*level; lines+=count; level=Math.floor(lines/10)+1;
      dropInterval=Math.max(100,1000-(level-1)*80);
      updateUI();
    }
  };

  const updateUI=()=>{
    scoreEl.textContent=score; levelEl.textContent=level; linesEl.textContent=lines;
  };

  const drawCell=(x,y,v)=>{
    ctx.fillStyle=v?COLORS[v]:'rgba(255,255,255,0.03)';
    ctx.fillRect(x*BLOCK+1,y*BLOCK+1,BLOCK-2,BLOCK-2);
  };
  const draw=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawCell(x,y,grid[y][x]);
    if(current)current.matrix.forEach((r,yy)=>r.forEach((v,xx)=>{
      if(v&&current.y+yy>=0)drawCell(current.x+xx,current.y+yy,v);
    }));
  };

  const move=d=>{current.x+=d;if(collide(grid,current))current.x-=d;};
  const softDrop=()=>{current.y++;if(collide(grid,current)){current.y--;lockPiece();}};
  const hardDrop=()=>{while(!collide(grid,current))current.y++;current.y--;lockPiece();};
  const rotatePiece=()=>{
    const prev=current.matrix;current.matrix=rotate(prev);
    if(collide(grid,current))current.matrix=prev;
  };

  const lockPiece=()=>{merge(grid,current);sweep();spawnPiece();};
  const spawnPiece=()=>{
    current=next;next=randomPiece();
    current.x=Math.floor((COLS-current.matrix[0].length)/2);current.y=0;
    if(collide(grid,current)){gameOver=true;paused=true;alert("Game Over\nScore:"+score);}
  };

  const update=(t=0)=>{
    if(paused||gameOver){lastTime=t;requestAnimationFrame(update);return;}
    const dt=t-lastTime;lastTime=t;dropCounter+=dt;
    if(dropCounter>dropInterval){softDrop();dropCounter=0;}
    draw();requestAnimationFrame(update);
  };

  function startGame(){
    grid=createGrid();current=randomPiece();next=randomPiece();
    score=0;level=1;lines=0;dropInterval=1000;dropCounter=0;paused=false;gameOver=false;
    updateUI();requestAnimationFrame(update);
  }

  // 键盘控制
  window.addEventListener('keydown',e=>{
    if(e.repeat)return;
    switch(e.key){
      case 'ArrowLeft':move(-1);break;
      case 'ArrowRight':move(1);break;
      case 'ArrowDown':softDrop();break;
      case 'ArrowUp':rotatePiece();break;
      case ' ':hardDrop();break;
      case 'p':case'P':paused=!paused;break;
      case 'r':case'R':startGame();break;
    }
    draw();
  });

  // ✅ 点击或 OK 键旋转支持
  canvas.addEventListener('click',()=>{rotatePiece();draw();});

  // ✅ 触控支持（手机 / 触屏电视）
  let sx,sy;
  canvas.addEventListener('touchstart',e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    const absX=Math.abs(dx),absY=Math.abs(dy);
    if(absX<10&&absY<10){rotatePiece();}
    else if(absX>absY){dx>0?move(1):move(-1);}
    else{dy>0?softDrop():hardDrop();}
    draw();
  },{passive:true});

  startGame();
})();
</script>
</body>
</html>
